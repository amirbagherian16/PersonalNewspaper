<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The TBI Daily</title>
<meta name="robots" content="noindex,nofollow">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css"></head><body>
<div class="app">
  <div class="top">
    <div class="brand">The TBI Daily<small id="sub">Loading…</small></div>
    <nav id="nav"></nav>
    <button class="iconbtn" id="lock" title="Lock" aria-label="Lock" hidden>🔒</button>
    <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
  </div>
  <main id="main"></main>
  <footer>Auto-built daily from PubMed, Europe PMC, Google News, LinkedIn (via news index), Mastodon, Hacker News, GitHub. No paid APIs.</footer>
</div>
<script src="graph.js"></script><script src="app.js"></script></body></html>
