name: Daily TBI newspaper

on:
  schedule:
    - cron: "30 11 * * *"   # 11:30 UTC daily (about 6:30 am US Central)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip the data refresh on push events; only redeploy then.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, classify, export
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python scripts/fetch.py
      - name: Commit changes
        run: |
          git config user.name "tbi-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs/data
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  deploy:
    needs: [build]
    # Run after build, or alone on push events (when build is skipped).
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
