name: Daily TBI newspaper

on:
  schedule:
    - cron: "30 11 * * *"   # 11:30 UTC daily (about 6:30 am US Central)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, classify, export
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python scripts/fetch.py
      - name: Commit changes
        run: |
          git config user.name "tbi-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs/data
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
